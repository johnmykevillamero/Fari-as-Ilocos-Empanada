<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fariñas Ilocos Empanada - San Mateo Branch</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CONNECTED CUSTOM CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-white shadow-md sticky top-0 z-40 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="https://images.unsplash.com/photo-1626700051175-6818013e1d4f?w=100&q=80" alt="Logo" class="w-10 h-10 rounded-full border-2 border-orange-500">
                <div>
                    <h1 class="text-base md:text-xl font-bold text-gray-800">Fariñas Ilocos Empanada</h1>
                    <p class="text-xs text-gray-500"><i class="fa-solid fa-location-dot text-red-500"></i> San Mateo Branch</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="toggleBag()" class="relative bg-gray-100 p-2.5 rounded-full text-gray-700">
                    <i class="fa-solid fa-basket-shopping text-lg"></i>
                    <span id="bag-count" class="absolute -top-1 -right-1 brand-orange text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>

                <button onclick="toggleAdminDrawer()" class="brand-orange text-white px-3 py-1.5 rounded-lg text-xs font-medium">
                    <i class="fa-solid fa-sliders mr-1"></i> Admin Panel
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
        <!-- SEARCH & FILTERS -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-3 mb-6">
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
                <input type="text" id="searchInput" onkeyup="filterMenu()" placeholder="Search menu..." class="w-full pl-9 pr-4 py-2 border rounded-lg text-xs">
            </div>
            
            <div class="flex space-x-1.5 overflow-x-auto">
                <button onclick="filterStatus('ALL')" class="status-btn active bg-gray-800 text-white px-3 py-1.5 rounded-full text-xs font-semibold">All Items</button>
                <button onclick="filterStatus('AVAILABLE')" class="status-btn bg-white border text-gray-700 px-3 py-1.5 rounded-full text-xs font-semibold">Available</button>
                <button onclick="filterStatus('SOLD_OUT')" class="status-btn bg-white border text-gray-700 px-3 py-1.5 rounded-full text-xs font-semibold">Sold Out</button>
            </div>
        </div>

        <!-- PRODUCT GRID (Dynamic load via JS from products.xml) -->
        <div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </main>

    <!-- ADMIN DRAWER -->
    <div id="adminDrawer" class="fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-4 border-b bg-gray-800 text-white flex justify-between items-center">
            <h3 class="font-bold text-sm"><i class="fa-solid fa-sliders text-yellow-400 mr-2"></i> Admin Panel (XML Editor)</h3>
            <button onclick="toggleAdminDrawer()" class="text-xl font-bold">&times;</button>
        </div>
        <div id="adminItemsList" class="p-4 flex-1 overflow-y-auto space-y-3"></div>
        <div class="p-4 border-t bg-gray-50">
            <button onclick="saveAdminChangesToXML()" class="w-full brand-green text-white py-2.5 rounded-lg text-xs font-bold">
                Save Changes to XML
            </button>
        </div>
    </div>

    <!-- SHOPPING BAG DRAWER -->
    <div id="bagDrawer" class="fixed inset-y-0 right-0 w-full md:w-80 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-4 border-b brand-orange text-white flex justify-between items-center">
            <h3 class="font-bold text-sm"><i class="fa-solid fa-basket-shopping mr-2"></i> Your Bag</h3>
            <button onclick="toggleBag()" class="text-xl font-bold">&times;</button>
        </div>
        <div id="bagItems" class="p-4 flex-1 overflow-y-auto space-y-3"></div>
        <div class="p-4 border-t bg-gray-50 flex justify-between font-bold text-sm">
            <span>Total:</span>
            <span id="bagTotal" class="text-brand-orange">₱0</span>
        </div>
    </div>

    <!-- CONNECTED CUSTOM JS -->
    <script src="script.js"></script>
</body>
</html>
